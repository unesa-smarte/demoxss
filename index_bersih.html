<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Kucing Lucu - Demo XSS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        .img-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .img-container img {
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .reset-btn {
            background-color: #f44336;
            margin-top: 10px;
        }
        .reset-btn:hover {
            background-color: #da190b;
        }
        .comments-section {
            margin-top: 25px;
            border-top: 2px solid #eee;
            padding-top: 15px;
        }
        .comment-box {
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .comment-author {
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h2>Foto Kucing Lucu Hari Ini 🐱</h2>
    
    <div class="img-container">
        <!-- Gambar kucing lucu dari PlaceKitten / Unsplash -->
        <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=500" alt="Kucing Lucu">
    </div>

    <!-- Form Komentar -->
    <form id="commentForm">
        <div class="form-group">
            <label for="nama">Nama:</label>
            <input type="text" id="nama" placeholder="Masukkan nama Anda" required>
        </div>
        <div class="form-group">
            <label for="komentar">Komentar:</label>
            <textarea id="komentar" rows="3" placeholder="Tulis komentar lucu..." required></textarea>
        </div>
        <button type="submit">Kirim Komentar</button>
    </form>
    
    <button class="reset-btn" onclick="resetDemo()">Reset Halaman (Hapus Simpanan XSS)</button>

    <!-- Tempat Komentar Ditampilkan -->
    <div class="comments-section">
        <h3>Daftar Komentar:</h3>
        <div id="commentList"></div>
    </div>
</div>

<script>
    // 1. Fungsi untuk merender komentar (LETAK KERENTANAN XSS)
    function renderComments() {
        const comments = JSON.parse(localStorage.getItem('demo_comments') || '[]');
        const commentListDiv = document.getElementById('commentList');
        commentListDiv.innerHTML = '';

        comments.forEach(item => {
            const div = document.createElement('div');
            div.className = 'comment-box';
            
            /* 
               CELAH KEAMANAN (VULNERABILITY):
               Penggunaan innerHTML secara langsung tanpa sanitasi/escaping.
               Jika isi 'item.komentar' mengandung tag <script> atau <img>, 
               browser akan langsung mengeksekusinya sebagai HTML/JS aktif.
            */
            div.innerHTML = `<span class="comment-author">${item.nama}:</span> <div>${item.komentar}</div>`;
            
            commentListDiv.appendChild(div);
        });
    }

    // 2. Event listener saat submit komentar
    document.getElementById('commentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const nama = document.getElementById('nama').value;
        const komentar = document.getElementById('komentar').value;

        const comments = JSON.parse(localStorage.getItem('demo_comments') || '[]');
        comments.push({ nama, komentar });
        localStorage.setItem('demo_comments', JSON.stringify(comments));

        document.getElementById('nama').value = '';
        document.getElementById('komentar').value = '';

        renderComments();
    });

    // 3. Fungsi reset untuk mengembalikan tampilan normal
    function resetDemo() {
        localStorage.removeItem('demo_comments');
        location.reload();
    }

    // Load komentar saat pertama dibuka
    renderComments();
</script>

</body>
</html>
